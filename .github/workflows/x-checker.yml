name: Data checker

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y flatpak

      - name: Install flatpak external data checker
        run: |
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --assumeyes org.flathub.flatpak-external-data-checker

      - name: Run external data checker
        run: |
          flatpak run \
          --filesystem=$PWD \
          org.flathub.flatpak-external-data-checker \
          --update \
          --edit-only \
          app.fluxer.FluxerCanary.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Flatpak sources"
          git push
