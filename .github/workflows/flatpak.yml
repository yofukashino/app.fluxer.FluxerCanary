name: Flatpak

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatter:
    name: Flatter
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged

    strategy:
      matrix:
        arch: [x86_64, aarch64]
      fail-fast: false
      # Only one job at a time can use the shared repository cache
      max-parallel: 1

    steps:
      # Checkout a repository with Flatpak manifests
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install runtimes (aarch64)
        if: ${{ matrix.arch == 'aarch64' }}
        run: |
          flatpak install --noninteractive  org.freedesktop.Sdk/aarch64/25.08
          flatpak install --noninteractive org.electronjs.Electron2.BaseApp/aarch64/25.08
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.node22/aarch64/25.08
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.rust-stable/aarch64/25.08
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.llvm22/aarch64/25.08

      - name: Install runtimes (x86_64)
        if: ${{ matrix.arch == 'x86_64' }}
        run: |
          flatpak install --noninteractive  org.freedesktop.Sdk/x86_64/25.08
          flatpak install --noninteractive org.electronjs.Electron2.BaseApp/x86_64/25.08
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.node22/x86_64/25.08
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.rust-stable/x86_64/25.08
          flatpak install --noninteractive org.freedesktop.Sdk.Extension.llvm22/x86_64/25.08

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: |
            app.fluxer.FluxerCanary.yml
          arch: ${{ matrix.arch }}
          upload-bundles: true
          upload-pages-artifact: ${{ matrix.arch == 'aarch64' }}

  # See "Github Pages" below
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: flatter
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1
