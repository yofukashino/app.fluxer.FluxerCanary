id: app.fluxer.FluxerCanary
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
command: app.fluxer.FluxerCanary
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-run/pipewire-0:ro
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --talk-name=org.ayatana.indicator.application
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
build-options:
  strip: true
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
modules:
  - native-dependencies.yml
  - name: fluxer-canary
    buildsystem: simple
    build-options:
      strip: true
      prepend-path: /run/build/fluxer-canary/pnpm/bin:/run/build/fluxer-canary/fluxer_desktop/node_modules/.bin
      env:
        BUILD_CHANNEL: canary
        LK_CUSTOM_WEBRTC: /run/build/fluxer-canary/webrtc-linux
        CARGO_HOME: /run/build/fluxer-canary/cargo
        CARGO_NET_OFFLINE: "true"
        NPM_CONFIG_LOGLEVEL: info
        XDG_CACHE_HOME: /run/build/fluxer-canary/flatpak-node/cache
        ELECTRON_SKIP_BINARY_DOWNLOAD: "true"
        npm_config_nodedir: /usr/lib/sdk/node22
        npm_config_store_dir: /run/build/fluxer-canary/flatpak-node/pnpm-store
        npm_config_offline: "true"
    build-commands:
      - bsdunzip -d webrtc-linux ./webrtc-linux.zip && mv ./webrtc-linux/linux-*-release/* ./webrtc-linux/
      - ln -s ./pnpm.cjs ./pnpm/bin/pnpm
      # For disabling automatic detection for pnpm
      - pnpm install --ignore-scripts --frozen-lockfile --offline --force
      - |
        set -eux
        . ../flatpak-node/electron-builder-arch-args.sh
        pnpm dev:desktop:package $ELECTRON_BUILDER_ARCH_ARGS
      - mv fluxer-desktop/dist-electron/linux*-unpacked $FLATPAK_DEST/fluxer-canary
      - mv $FLATPAK_DEST/fluxer-canary/fluxer_desktop_canary $FLATPAK_DEST/fluxer-canary/fluxer-canary
      # Inject the correct Flatpak App ID directly into the Electron archive:
      - patch-electron-desktop-filename ${FLATPAK_DEST}/fluxer-canary/resources/app.asar
      - install -Dm755 ${FLATPAK_ID}.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - install -Dm644 packaging/linux/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/linux/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 packaging/linux/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: git
        url: https://github.com/fluxerapp/fluxer.git
        commit: fa3e8525755dae087c03ceaf83b814cbe46c7228
        disable-submodules: true
      - type: file
        path: app.fluxer.FluxerCanary.sh
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-10.25.0.tgz
        sha512: 5e82639027af37cf832061bcc6d639c219634488e0f2baebe785028a793de7b525ffcd3f7ff574f5e9860654e098fe852ba8ac5dd5cefe1767d23a020a92f501
        dest: pnpm
      - pnpm-sources.json
      - cargo-sources.json
      - cargo-linux-webrtc.json
