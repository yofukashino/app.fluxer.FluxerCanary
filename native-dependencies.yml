name: native-dependencies
buildsystem: simple
build-commands: []
modules:
  - name: fakepid
    buildsystem: simple
    build-commands:
      - cc -shared -fPIC -O2 fake-getpid.c -o libfakepid.so -ldl
      - install -Dm755 libfakepid.so /app/lib/libfakepid.so
    sources:
      - type: file
        path: fake-getpid.c
  - name: libcbor
    buildsystem: cmake
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
      - /lib/*.a
    sources:
      - type: git
        url: https://github.com/PJK/libcbor
        tag: v0.14.0
  - name: libfido2
    buildsystem: cmake
    config-opts:
      - -DBUILD_TESTS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_MANPAGES=OFF
      - -DBUILD_TOOLS=OFF
      - -DBUILD_STATIC_LIBS=OFF
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/cmake
    sources:
      - type: git
        url: https://github.com/Yubico/libfido2
        tag: 1.17.0
